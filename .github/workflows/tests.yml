name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  all:
    runs-on: ubuntu-26.04
    env:
      LOCKFILE: .github/ubuntu-26.lock
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v9
        with:
          python-version-file: .github/python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@10.3.3
      - name: Install locked test dependencies
        id: install-lock
        run: |
          if [[ ! -f "$LOCKFILE" ]]; then
            echo "Lockfile is missing: $LOCKFILE"
            exit 1
          fi
          uv venv
          uv pip sync --python .venv/bin/python "$LOCKFILE"
      - name: Generate lockfile
        id: generate-lock
        if: ${{ !cancelled() && steps.install-lock.outcome == 'failure' }}
        run: uv pip compile test/requirements.txt --output-file "$LOCKFILE"
      - name: Upload generated lockfile
        if: ${{ !cancelled() && steps.generate-lock.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-lock
          path: ${{ env.LOCKFILE }}
      - name: Run test
        run: uv run --python .venv/bin/python -m pytest -q test
