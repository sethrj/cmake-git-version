name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version (for example, 1.2.3 or 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-z]+(0|[1-9][0-9]*)?(\.(0|[1-9][0-9]*))*)?$ ]]; then
            echo "Version must be compatible with this project's SemVer tags (MAJOR.MINOR.PATCH with an optional lowercase prerelease)." >&2
            exit 1
          fi

          npx --yes semver@7 "$VERSION" >/dev/null
          TAG="v$VERSION"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          mapfile -t versions < <(
            git tag --list 'v*' \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-z]+(0|[1-9][0-9]*)?(\.(0|[1-9][0-9]*))*)?$' \
              | sed 's/^v//'
          )

          if ((${#versions[@]})); then
            latest="$(npx --yes semver@7 --include-prerelease "${versions[@]}" | tail -n 1)"
            if ! npx --yes semver@7 --include-prerelease --range=">$latest" "$version" >/dev/null; then
              echo "Version must be newer than the latest compatible release: v$latest" >&2
              exit 1
            fi
          fi

      - name: Create local tag and source archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git tag "$TAG"
          archive="cmake-git-version-${TAG}.tgz"
          git archive --format=tar.gz --prefix="cmake-git-version-${TAG}/" --output="$archive" "$TAG"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Test source archive installation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          LOCAL="$(mktemp -d)"
          USERCODE="$(mktemp -d)"
          trap 'rm -rf "$LOCAL" "$USERCODE"' EXIT

          tar -xzf "$GITHUB_WORKSPACE/$ARCHIVE" --strip-components=1 -C "$LOCAL"
          (cd "$LOCAL" && ./install.sh "$USERCODE")

          installed="$USERCODE/CgvFindVersion.cmake"
          test -f "$installed"
          expected="# cmake-git-version $VERSION"
          actual="$(tail -n 1 "$installed")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected final line '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create --draft --target "$GITHUB_SHA" --title "Version $VERSION" --generate-notes  "v$VERSION" "$ARCHIVE"
